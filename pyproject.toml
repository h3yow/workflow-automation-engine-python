[project]
name = "workflow-automation-engine-python"
version = "0.1.0"
requires-python = ">=3.14.4"
dependencies = [
    "fastapi[standard]>=0.141.1",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q -s"

[[tool.uv.index]]
url = "https://mirrors.aliyun.com/pypi/simple/"
default = true
